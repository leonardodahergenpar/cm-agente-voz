name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: testes
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q test/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leonardodahergenpar/cm-agente-voz:latest
            ghcr.io/leonardodahergenpar/cm-agente-voz:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
