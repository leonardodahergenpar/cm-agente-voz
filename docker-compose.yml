# Agente de voz da Conta Medical — Hostinger Docker Manager → projeto "cm-agente-voz" → Compose Manually.
# Imagem publicada pelo GitHub Actions deste repositório (igual ao conector).
# Preencher SÓ as linhas marcadas com COLE_AQUI (direto aqui no Docker Manager; nunca pelo chat):
#   LIVEKIT_API_KEY / LIVEKIT_API_SECRET → a chave criada no LiveKit Cloud (as mesmas dos secrets do Supabase)
#   GOOGLE_API_KEY       → chave do Gemini (Google AI Studio)
#   SUPABASE_SERVICE_KEY → a chave secreta cm_agente_voz (começa com sb_secret_; a antiga eyJ… está desativada)
#   S3_REGION / S3_ACCESS_KEY / S3_SECRET_KEY → Supabase → Storage → Settings → S3 Connection (região da tela + New access key)
# Não precisa de porta aberta: o agente só faz conexões de saída (LiveKit Cloud, Gemini e Supabase).
services:
  agente:
    image: ghcr.io/leonardodahergenpar/cm-agente-voz:latest
    container_name: cm-agente-voz
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://cm-comercial-dgkynimo.livekit.cloud
      LIVEKIT_API_KEY: COLE_AQUI
      LIVEKIT_API_SECRET: COLE_AQUI
      GOOGLE_API_KEY: COLE_AQUI
      SUPABASE_URL: https://cjxyywgzjbeeaaehjxtv.supabase.co
      SUPABASE_SERVICE_KEY: COLE_AQUI
      VOZ_AGENTE_NOME: cm-voz
      VOZ_AGENTE_ID: cm-agente-voz-hostinger
      # modelo e voz do Gemini Live (trocar aqui para testar outra voz: Aoede, Leda, Kore, Zephyr, Charon, Puck…)
      GEMINI_LIVE_MODEL: gemini-3.8-live
      GEMINI_VOZ: Leda
      # filtro de ruído da LiveKit Cloud no áudio do médico ("0" desliga)
      VOZ_FILTRO_RUIDO: "1"
      # pausa (ms) que encerra a vez do médico: menor = ela responde mais rápido, mas pode cortar quem pausa ao falar
      VOZ_SILENCIO_MS: "500"
      VOZ_ESPERA_HUMANO_S: "45"
      VOZ_MAX_MIN: "15"
      # gravação do áudio no Storage do Supabase (bucket privado crm-ligacoes, guarda de 6 meses)
      S3_ENDPOINT: https://cjxyywgzjbeeaaehjxtv.storage.supabase.co/storage/v1/s3
      S3_REGION: COLE_AQUI
      S3_ACCESS_KEY: COLE_AQUI
      S3_SECRET_KEY: COLE_AQUI
      S3_BUCKET: crm-ligacoes
      TZ: America/Belem
    deploy:
      resources:
        limits:
          memory: 2g
